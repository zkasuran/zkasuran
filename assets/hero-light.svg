<svg viewBox="0 0 1600 400" width="1600" height="400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="asuran. agent tooling, dev infra, open source">
  <defs>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .node   { animation: nodePulse 2.6s ease-in-out infinite; }
      .edge   { stroke-dasharray: 3 5; animation: dashFlow 1.2s linear infinite; }
      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
      @keyframes nodePulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
      @keyframes dashFlow { to { stroke-dashoffset: -32 } }
    </style>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#0d9488" stop-opacity=".12"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#0891b2" stop-opacity=".10"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#0d9488" stop-opacity=".08"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#59636e"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="word"><text x="0" y="100" font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif" font-weight="700" font-size="112">asuran</text></clipPath>
    <clipPath id="scr"><rect x="1" y="53" width="358" height="130" rx="4"/></clipPath>
  </defs>

  <rect width="1600" height="400" fill="#ffffff"/>
  <rect width="1600" height="400" fill="url(#dots)" opacity=".06"/>
  <ellipse cx="240" cy="180" rx="360" ry="280" fill="url(#b1)"><animate attributeName="cx" values="240;360;240" dur="21s" repeatCount="indefinite"/><animate attributeName="cy" values="180;140;180" dur="16s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1360" cy="210" rx="420" ry="300" fill="url(#b2)"><animate attributeName="cx" values="1360;1230;1360" dur="26s" repeatCount="indefinite"/><animate attributeName="cy" values="210;260;210" dur="19s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="820" cy="360" rx="520" ry="240" fill="url(#b3)"><animate attributeName="cx" values="820;920;820" dur="23s" repeatCount="indefinite"/></ellipse>
  <rect x="0" y="0" width="8" height="400" fill="#0d9488" opacity=".8"/>

  <g transform="translate(120,108)" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15">
    <rect width="360" height="184" rx="9" fill="#0d1117" stroke="#d0d7de"/>
    <circle cx="24" cy="26" r="6" fill="#ff5f56"/><circle cx="48" cy="26" r="6" fill="#ffbd2e"/><circle cx="72" cy="26" r="6" fill="#27c93f"/>
    <line x1="0" y1="52" x2="360" y2="52" stroke="#30363d"/>
    <g clip-path="url(#scr)">
      <text x="24" y="90" fill="#2dd4bf">&#10095;</text>
      <text x="46" y="90" fill="#e6edf3">asuran --init</text>
      <rect x="44" y="76" width="180" height="22" fill="#0d1117"><animateTransform attributeName="transform" type="translate" from="0 0" to="180 0" begin=".4s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect>
      <text x="24" y="124" fill="#2dd4bf">&#10095;</text>
      <text x="46" y="124" fill="#e6edf3">build &#183; test &#183; ship</text>
      <rect x="44" y="110" width="240" height="22" fill="#0d1117"><animateTransform attributeName="transform" type="translate" from="0 0" to="240 0" begin="1.7s" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/></rect>
      <text x="24" y="158" fill="#2dd4bf">&#10095;</text>
      <rect class="cursor" x="46" y="145" width="11" height="17" fill="#2dd4bf"/>
    </g>
  </g>

  <g transform="translate(560,92)">
    <text x="0" y="100" font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif" font-weight="700" font-size="112" fill="#1f2328" filter="url(#glow)">asuran</text>
    <g clip-path="url(#word)"><rect x="-320" y="0" width="200" height="140" fill="url(#sheen)"><animate attributeName="x" values="-320;620" dur="4.5s" begin="1s" repeatCount="indefinite"/></rect></g>
    <text x="4" y="146" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="32" fill="#0d9488">@zkasuran</text>
    <text x="4" y="184" font-family="'Segoe UI',system-ui,Helvetica,Arial,sans-serif" font-size="24" fill="#59636e">agent tooling &#183; dev infra &#183; open source</text>
  </g>

  <g transform="translate(1180,60)" filter="url(#soft)">
    <g stroke="#0d9488" stroke-opacity=".5" stroke-width="1.4" class="edge">
      <line x1="60" y1="280" x2="140" y2="220"/><line x1="60" y1="280" x2="20" y2="180"/><line x1="60" y1="280" x2="100" y2="120"/>
      <line x1="140" y1="220" x2="200" y2="260"/><line x1="140" y1="220" x2="200" y2="140"/><line x1="140" y1="220" x2="260" y2="180"/>
      <line x1="20" y1="180" x2="100" y2="120"/><line x1="100" y1="120" x2="200" y2="140"/><line x1="200" y1="260" x2="260" y2="180"/>
      <line x1="200" y1="140" x2="260" y2="180"/><line x1="200" y1="140" x2="320" y2="120"/><line x1="260" y1="180" x2="320" y2="120"/>
    </g>
    <circle cx="60" cy="280" r="6" fill="#0d9488" class="node"/>
    <circle cx="140" cy="220" r="9" fill="#0891b2" class="node" style="animation-delay:.3s"/>
    <circle cx="20" cy="180" r="5" fill="#0d9488" class="node" style="animation-delay:.6s"/>
    <circle cx="100" cy="120" r="6" fill="#0d9488" class="node" style="animation-delay:.9s"/>
    <circle cx="200" cy="260" r="7" fill="#0891b2" class="node" style="animation-delay:1.2s"/>
    <circle cx="200" cy="140" r="9" fill="#0891b2" class="node" style="animation-delay:1.5s"/>
    <circle cx="260" cy="180" r="6" fill="#0d9488" class="node" style="animation-delay:1.8s"/>
    <circle cx="320" cy="120" r="5" fill="#0d9488" class="node" style="animation-delay:.2s"/>
    <circle cx="140" cy="220" r="9" fill="none" stroke="#0891b2" stroke-width="2"><animate attributeName="r" values="9;28" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="140" r="9" fill="none" stroke="#0891b2" stroke-width="2"><animate attributeName="r" values="9;28" dur="2.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
    <g><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion><circle r="3.5" fill="#0d9488" filter="url(#glow)"/></g>
    <g><animateMotion dur="5s" begin="1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion><circle r="3.5" fill="#0d9488" filter="url(#glow)"/></g>
    <path id="p1" d="M60,280 L140,220 L200,260 L260,180 L320,120" fill="none"/>
    <path id="p2" d="M60,280 L20,180 L100,120 L200,140 L260,180" fill="none"/>
  </g>
</svg>
